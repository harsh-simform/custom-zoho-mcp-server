[project]
name = "zoho-projects-mcp"
version = "0.2.0"
description = "Read-only Zoho Projects for agents: the token-lean zoho-axi CLI and a six-tool MCP server"
readme = "README.md"
keywords = ["zoho", "zoho-projects", "mcp", "claude", "cli", "toon"]
requires-python = ">=3.10"
dependencies = [
    "mcp>=2.0.0",
    "requests>=2.31.0",
    "python-dotenv>=1.0.0",
    "tomli>=2.0.0; python_version < '3.11'",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "mypy>=1.8", "types-requests>=2.31"]
# Optional: tiktoken adds its count to token-budget failure messages (reporting only, never gates a test).
tokens = ["tiktoken>=0.7"]

[project.scripts]
zoho-axi = "zoho_axi.cli.main:console_main"
zoho = "zoho_axi.cli.main:console_main"  # short alias for zoho-axi
# Deprecated: the pre-0.2 MCP entry point, kept so existing registrations keep working. Use `zoho-axi mcp`.
zoho-projects-mcp = "zoho_axi.mcp_server.server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["zoho_mcp*", "zoho_axi*"]

[tool.setuptools.package-data]
# The Claude Code skill `zoho-axi skill install` copies (read via importlib.resources).
zoho_axi = ["skills/*/SKILL.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
