[project]
name = "zoho-projects-mcp"
version = "0.1.0"
description = "Read-only MCP server exposing Zoho Projects context to Claude"
requires-python = ">=3.10"
dependencies = [
    "mcp>=2.0.0",
    "requests>=2.31.0",
    "python-dotenv>=1.0.0",
    "tomli>=2.0.0; python_version < '3.11'",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
# Optional: tiktoken adds its count to token-budget failure messages (reporting only, never gates a test).
tokens = ["tiktoken>=0.7"]

[project.scripts]
zoho-projects-mcp = "zoho_mcp.server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["zoho_mcp*", "zoho_axi*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
