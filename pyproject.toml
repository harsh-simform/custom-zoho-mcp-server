[project]
name = "zoho-projects-mcp"
version = "0.1.0"
description = "Read-only MCP server exposing Zoho Projects context to Claude"
requires-python = ">=3.10"
dependencies = [
    "mcp>=2.0.0",
    "requests>=2.31.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
zoho-projects-mcp = "zoho_mcp.server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["zoho_mcp*"]
